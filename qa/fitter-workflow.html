<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitter workflow — isolated demonstration</title><link rel="stylesheet" href="../pdc-fitters.css"><style>body{margin:16px;background:#f2f5f8}.demo-tools{padding:8px;background:#fff2b7;font:14px system-ui}.demo-tools button{margin:4px}</style><body data-current-view="fitters"><div class="demo-tools">Isolated test data · no network or live bookings<button id="demo-controller">Controller starts job</button><button id="demo-offline">Fail next save</button><button id="demo-scope">Change operation hours</button><button id="demo-viewer">View only</button></div><div id="fitters-host"></div><script>
window.PDC_AUTH_CONTEXT={userId:'demo-actor',role:'operator'};window.PDC_SUPABASE_CONFIG={projectRef:'cdsmnqxtyyoeoznmbidd',url:'https://cdsmnqxtyyoeoznmbidd.supabase.co',publishableKey:'DEMO-NO-NETWORK',workshop:{sharedData:true}};function getPdcSupabaseAccessToken(){return 'demo';}function showView(){document.querySelector('.demo-tools').textContent='QC navigation selected (isolated demo)';}
let version=1,status='planned',fail=false,hash='scope-1',reason='',receipts=new Map();
const lines=[{line_identity:'one',description:'Pre-delivery inspection and road test',stage_code:'FITTING',hours:1,scope_hash:'a',completed:false,note:''},{line_identity:'two',description:'SUPPLY AND FIT ARB SUMMIT BAR MK2 HILUX MY265 — check radar clearance and mounting hardware',stage_code:'FITTING',hours:2,scope_hash:'b',completed:false,note:'Check bracket clearance before tightening.'},{line_identity:'three',description:'Tray, towbar and electrical accessories package',stage_code:'FITTING',hours:7,scope_hash:'c',completed:false,note:''},{line_identity:'four',description:'Window tint · darkest legal',stage_code:'TINT',hours:1,scope_hash:'d',completed:false,note:''}];
const progress=()=>{let own=lines.filter(l=>l.stage_code==='FITTING'),total=own.reduce((n,l)=>n+l.hours,0),done=own.filter(l=>l.completed).reduce((n,l)=>n+l.hours,0);return {total_hours:total,completed_hours:done,percent:Math.floor(done/total*100),total_lines:3,completed_lines:own.filter(l=>l.completed).length,can_complete:done===total,unknown_hours:0};};
const booking=(id,n)=>({id,version,status:id==='job-1'?status:'planned',stage_code:'FITTING',stage_name:'Fitting',bay_number:1,bay_name:'Fitting Bay 1',start_at:'2026-09-16T00:00:00Z',end_at:'2026-09-17T02:00:00Z',stock:'DEMO-00'+n,job_card:'DEMO-JC'+n,customer:'Demonstration Customer',vehicle:'HiLux 4x4 2.8L WorkMate',progress:id==='job-1'?progress():null});
window.fetch=async(url,opts)=>{let b=JSON.parse(opts.body),name=url.split('/').pop(),result;if(name==='get_fitter_roster')result={ok:true,technicians:[{id:'demo-mechanic',name:'Demo mechanic'}]};else if(name==='get_fitter_jobs')result={ok:true,bays:[{number:1,stage:'Fitting',active:true}],jobs:[...(status==='completed'?[]:[booking('job-1',1)]),booking('job-2',2),booking('job-3',3)]};else if(name==='get_fitter_job')result={ok:true,booking_id:b.p_booking_id,version,status:b.p_booking_id==='job-1'?status:'planned',stage_code:'FITTING',stoppage_reason:reason,lines:b.p_booking_id==='job-1'?lines:lines.map(l=>({...l,completed:false,note:''})),progress:b.p_booking_id==='job-1'?progress():{...progress(),completed_hours:0,percent:0,completed_lines:0,can_complete:false},catalog_hash:hash};else if(name==='fitter_job_command'){if(fail){fail=false;throw Error('demo offline');}if(receipts.has(b.p_request_id))result=receipts.get(b.p_request_id);else {if(b.p_action==='start')status='started';if(b.p_action==='line'){let l=lines.find(l=>l.line_identity===b.p_line_identity);l.completed=b.p_completed;l.note=b.p_note;}if(b.p_action==='stop'){status='stoppage';reason=b.p_note;}if(b.p_action==='resume')status='started';if(b.p_action==='complete')status='completed';version++;result={ok:true,action:b.p_action};receipts.set(b.p_request_id,result);}}else throw Error('Unexpected endpoint '+name);return {ok:true,json:async()=>structuredClone(result)};};
document.getElementById('demo-controller').onclick=()=>{status='started';version++;};document.getElementById('demo-offline').onclick=()=>{fail=true;};document.getElementById('demo-scope').onclick=()=>{hash='scope-2';lines[0].hours=2;lines[0].scope_hash='changed';lines[0].scope_changed=true;lines[0].completed=false;};document.getElementById('demo-viewer').onclick=()=>{PDC_AUTH_CONTEXT.role='viewer';};
</script><script src="../pdc-fitters.js"></script><script>PdcFitters.open();</script></body></html>

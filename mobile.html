<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PDC Mobile Board</title>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <header class="mobile-header">
    <div>
      <span class="eyebrow">PDC mobile</span>
      <h1>Vehicle board</h1>
      <p id="mobile-as-of">Loading vehicle data…</p>
    </div>
    <a class="desktop-link" href="index.html">Desktop</a>
  </header>

  <main>
    <section class="summary-grid" aria-label="Vehicle summary">
      <button class="summary-card active" type="button" data-filter="all"><span>All</span><strong id="count-all">0</strong></button>
      <button class="summary-card" type="button" data-filter="pmb"><span>PMB</span><strong id="count-pmb">0</strong></button>
      <button class="summary-card" type="button" data-filter="blocked"><span>Blocked</span><strong id="count-blocked">0</strong></button>
      <button class="summary-card" type="button" data-filter="rft"><span>RFT</span><strong id="count-rft">0</strong></button>
    </section>

    <section class="toolbar" aria-label="Mobile board controls">
      <label>
        <span>Search</span>
        <input id="mobile-search" type="search" autocomplete="off" placeholder="Stock, client, vehicle, batch…">
      </label>
      <label>
        <span>Stage</span>
        <select id="mobile-stage-filter">
          <option value="">All stages</option>
          <option value="YH">Yard Hold</option>
          <option value="PMB">PMB</option>
          <option value="RFT">Ready for Transport</option>
          <option value="TINT">Tint</option>
          <option value="BUILD">Build / fitting</option>
          <option value="FABRICATION">Fabrication</option>
          <option value="ELECTRICAL">Electrical</option>
          <option value="SUBLET">Sublet / third-party</option>
        </select>
      </label>
    </section>

    <section class="mobile-note">
      <strong>Mobile quick view.</strong> Separate read-only page for phones. The existing desktop site is unchanged.
    </section>

    <section id="mobile-list" class="vehicle-list" aria-live="polite"></section>
    <p id="empty-state" class="empty-state" hidden>No vehicles match this search.</p>
  </main>

  <script src="data.js"></script>
  <script src="mobile.js"></script>
</body>
</html>

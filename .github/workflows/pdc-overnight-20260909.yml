name: PDC overnight verification 9-10 Sep 2026

on:
  pull_request:
    paths: ['qa/overnight/**', '.github/workflows/pdc-overnight-20260909.yml']
  push:
    branches: [main]
    paths: ['qa/overnight/**', '.github/workflows/pdc-overnight-20260909.yml']
  schedule:
    - cron: '47 14-22 9 9 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdc-one-night-verification-20260909
  cancel-in-progress: false

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - id: window
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, os
          now = datetime.datetime.now(datetime.timezone.utc)
          event = os.environ['GITHUB_EVENT_NAME']
          permitted = event == 'pull_request' or datetime.datetime(2026,9,9,0,tzinfo=datetime.timezone.utc) <= now < datetime.datetime(2026,9,9,23,15,tzinfo=datetime.timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run=' + str(permitted).lower() + '\n')
          print('One-night test window permitted:', permitted)
          PY

  verify:
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test tools
        run: |
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Execute offline frontend tests and public STAGING byte checks
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: python qa/overnight/run_suite.py --engine "$QA_ENGINE" --output "qa-results/$QA_ENGINE"
      - name: Attach run breakdown
        if: always()
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: |
          if [ -f "qa-results/$QA_ENGINE/REPORT.md" ]; then
            cat "qa-results/$QA_ENGINE/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Test infrastructure failed before report generation. This is NOT a pass.' >> "$GITHUB_STEP_SUMMARY"
            mkdir -p "qa-results/$QA_ENGINE"
            echo 'Infrastructure did not complete; inspect Actions logs.' > "qa-results/$QA_ENGINE/INFRASTRUCTURE-FAILURE.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdc-overnight-${{ github.run_id }}-${{ matrix.engine }}
          path: qa-results/${{ matrix.engine }}/
          retention-days: 14
          if-no-files-found: error

  report:
    needs: [window, verify]
    if: always() && needs.window.outputs.run == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Record outcome and expire only this QA workflow after final cycle
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,urllib.request
          now=datetime.datetime.now(datetime.timezone.utc)
          base='https://api.github.com/repos/'+os.environ['REPO']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          def send(path,method,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:return response.status
          run='https://github.com/'+os.environ['REPO']+'/actions/runs/'+os.environ['RUN_ID']
          result=os.environ['VERIFY_RESULT']
          body='### Overnight verification cycle\n\nUTC: '+now.isoformat()+'\n\nRun: '+run+'\n\nCommit: `'+os.environ['COMMIT']+'`\n\nAutomated job result: **'+result.upper()+'**. Each browser artifact contains its complete case results, TAP, screenshots and function/control inventories. A green job proves only its executed tests.\n\n**Not certified:** real staff login/session, physical iPhone upload, native Outlook handoff, recurring Revolution/Email AI operation, independent-user concurrency, printer hardware, fresh DB recovery, and every destructive administrative function. No customer or Production writes and no business credentials are used by this runner.'
          if now>=datetime.datetime(2026,9,9,22,40,tzinfo=datetime.timezone.utc):
              try:
                  send('/actions/workflows/pdc-overnight-20260909.yml/disable','PUT')
                  body+='\n\nFinal QA window: this verification workflow is now disabled. Business schedulers were not changed.'
              except Exception as exc:
                  body+='\n\nAutomatic QA workflow disable was not confirmed ('+type(exc).__name__+'). The date guard prevents test execution after the window; this is not a claim of scheduler disable.'
          send('/issues/73/comments','POST',{'body':body})
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write(body+'\n')
          PY

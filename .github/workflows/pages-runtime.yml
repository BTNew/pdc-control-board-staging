name: Publish staging runtime website

# Enable only after Pages Source is changed to GitHub Actions. The source check
# fails closed while the legacy generated workflow still publishes the checkout.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-runtime-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run website regressions and artifact guards
        run: node --test test_*.js
      - name: Reject privileged frontend credentials
        run: node scripts/check_frontend_secrets.js
      - name: Build only the reviewed public runtime
        run: node scripts/build_pages_runtime.js --output _site
      - name: Observe Pages source for a same-repository pull request
        if: github.event_name == 'pull_request' && github.repository == 'BTNew/pdc-control-board-staging' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PAGES_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`;
          const response = await fetch(url, { headers: {
            Authorization: `Bearer ${process.env.PAGES_READ_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2026-03-10'
          } });
          if (!response.ok) throw new Error(`Cannot observe Pages publishing source (HTTP ${response.status}).`);
          const pages = await response.json();
          if (!['legacy', 'workflow'].includes(pages.build_type)) throw new Error('Pages publishing source returned an unknown build type.');
          console.log(`Pages build_type: ${pages.build_type}`);
          NODE
      - name: Require the GitHub Actions publishing source
        if: github.event_name != 'pull_request' && github.repository == 'BTNew/pdc-control-board-staging' && github.ref == 'refs/heads/main'
        env:
          PAGES_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`;
          const response = await fetch(url, { headers: {
            Authorization: `Bearer ${process.env.PAGES_READ_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2026-03-10'
          } });
          if (!response.ok) throw new Error(`Cannot verify Pages publishing source (HTTP ${response.status}).`);
          const pages = await response.json();
          if (pages.build_type !== 'workflow') throw new Error('Set repository Settings > Pages > Source to GitHub Actions before publishing this runtime artifact.');
          console.log('Pages publishing source verified: GitHub Actions.');
          NODE
      - name: Configure Pages metadata
        if: github.event_name != 'pull_request' && github.repository == 'BTNew/pdc-control-board-staging' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload the clean public artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'BTNew/pdc-control-board-staging' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified runtime artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

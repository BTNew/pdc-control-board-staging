name: Stage 2B C6 final portable verification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/stage2b-shared-vehicle-master

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Configure portable Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install portable Python dependencies
        run: python -m pip install --disable-pip-version-check cryptography "psycopg[binary]" pglast
      - name: Safe configuration setup
        run: |
          cp pdc-supabase-config.example.js pdc-supabase-config.js
          python - <<'PY'
          from pathlib import Path
          target = Path('supabase/.temp/project-ref')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('cdsmnqxtyyoeoznmbidd\n', encoding='utf-8')
          PY
      - name: Root JavaScript aggregate
        run: npm test
      - name: Stage 2B Python regression
        run: python -B -m unittest discover -s backend -p "test_stage2b*.py" -v
      - name: C2b parity and artifact suites
        run: python -B -m unittest backend.test_stage2b_offline_vehicle_reference_artifact backend.test_stage2b_importer_identity_export_foundation backend.test_stage2b_importer_identity_export_adapter backend.test_stage2b_importer_identity_export_staging -v
      - name: C6 focused and dual-revision suites
        run: python -B -m unittest backend.test_stage2b_c6_operational_rehearsal -v
      - name: Guarded migration SQL parser
        run: python scripts/stage2b_c6_sql_parse.py
      - name: Line-ending portability
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/stage2b-c6-final.yml'),
              Path('scripts/stage2b_c6_browser_realtime_acceptance.js'),
              Path('scripts/stage2b_c6_sql_parse.py'),
              Path('scripts/pdc_restore.py'),
              Path('supabase/migrations/028_stage2b_vehicle_master_foundation.sql'),
              Path('supabase/migrations/029_stage2b_vehicle_master_operations.sql'),
              Path('supabase/migrations/030_stage2b_lifecycle_identity_resolver.sql'),
              Path('supabase/migrations/031_stage2b_importer_identity_export.sql'),
          ]
          invalid = [path.as_posix() for path in paths if b'\r\n' in path.read_bytes()]
          if invalid:
              raise SystemExit(f'CRLF found in portable C6 source: {invalid}')
          print(f'LF-only portable C6 files: {len(paths)}')
          PY
      - name: Portable syntax and repository integrity
        run: |
          node --check scripts/stage2b_c6_browser_realtime_acceptance.js
          python -m py_compile scripts/stage2b_c6_*.py scripts/pdc_backup.py scripts/pdc_restore.py
          git diff --check
          test -z "$(git status --porcelain)"

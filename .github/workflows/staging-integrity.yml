name: Staging integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment provenance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const p = JSON.parse(fs.readFileSync('deployment-identity.json', 'utf8'));
          if (p.environment !== 'staging') throw new Error('deployment identity must be staging');
          if (p.staging_project_ref !== 'cdsmnqxtyyoeoznmbidd') throw new Error('unexpected staging project ref');
          if (p.complete_vehicle_delete_commissioned !== false) throw new Error('unreviewed complete delete must remain uncommissioned');
          const c = p.candidate_database_migration;
          if (!c || !c.version || !c.file || !c.sha256) throw new Error('missing candidate migration provenance');
          if (c.commissioned !== false || c.review_status !== 'changes_required') throw new Error('candidate migration status must remain fail closed');
          if (!fs.existsSync(c.file)) throw new Error(`missing candidate migration file: ${c.file}`);
          const m = c.file.match(/(?:^|\/)(\d+)_/);
          if (!m || m[1] !== String(c.version)) throw new Error('candidate migration version does not match filename');
          const digest = crypto.createHash('sha256').update(fs.readFileSync(c.file)).digest('hex');
          if (digest !== c.sha256) throw new Error('candidate migration digest mismatch');
          if (p.observed_applied_database_migration?.version === c.version) throw new Error('uncommissioned candidate cannot be recorded as applied');
          NODE
      - name: Verify index local assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map(m => m[1].split('?')[0]);
          const local = refs.filter(x => x && !/^(?:https?:|data:|mailto:|tel:|#)/i.test(x) && !x.startsWith('/'));
          const missing = [...new Set(local.filter(x => !fs.existsSync(x)))];
          if (missing.length) throw new Error(`missing local assets: ${missing.join(', ')}`);
          NODE
      - name: Verify canonical website links and retired entry points
        run: node test_legacy_website_links.js
      - name: Reject obvious privileged frontend secrets
        run: |
          if grep -Eini --include='*.js' --include='*.html' --exclude='deployment-identity.json' '(service_role|sb_secret_)' .; then
            echo 'Privileged Supabase secret marker found in frontend files.'
            exit 1
          fi

name: Staging integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment provenance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const p = JSON.parse(fs.readFileSync('deployment-identity.json', 'utf8'));
          if (p.environment !== 'staging') throw new Error('deployment identity must be staging');
          if (p.staging_project_ref !== 'cdsmnqxtyyoeoznmbidd') throw new Error('unexpected staging project ref');
          if (p.complete_vehicle_delete_commissioned !== false) throw new Error('unreviewed complete delete must remain uncommissioned');
          if (p.candidate_database_migration !== null) throw new Error('staging release must not advertise a stale uncommissioned candidate');
          const applied = p.observed_applied_database_migration;
          if (!applied || !applied.version || !applied.file || !applied.sha256) throw new Error('missing applied migration provenance');
          if (applied.commissioned !== true || applied.review_status !== 'staging_applied') throw new Error('applied migration status is not authoritative');
          if (!fs.existsSync(applied.file)) throw new Error(`missing applied migration file: ${applied.file}`);
          const m = applied.file.match(/(?:^|\/)(\d+)_/);
          if (!m || m[1] !== String(applied.version)) throw new Error('applied migration version does not match filename');
          const digest = crypto.createHash('sha256').update(fs.readFileSync(applied.file)).digest('hex');
          if (digest !== applied.sha256) throw new Error('applied migration digest mismatch');
          const app = fs.readFileSync('app.js', 'utf8');
          const version = app.match(/const APP_VERSION = '([^']+)'/)?.[1];
          if (!version || version !== p.application_version) throw new Error('application version provenance mismatch');
          NODE
      - name: Verify index local assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map(m => m[1].split('?')[0]);
          const local = refs.filter(x => x && !/^(?:https?:|data:|mailto:|tel:|#)/i.test(x) && !x.startsWith('/'));
          const missing = [...new Set(local.filter(x => !fs.existsSync(x)))];
          if (missing.length) throw new Error(`missing local assets: ${missing.join(', ')}`);
          NODE
      - name: Verify canonical website links and retired entry points
        run: node test_legacy_website_links.js
      - name: Run staging regression suite
        run: node --test test_*.js
      - name: Reject obvious privileged frontend secrets
        run: |
          if grep -Eini --include='*.js' --include='*.html' --exclude='deployment-identity.json' '(service_role|sb_secret_)' .; then
            echo 'Privileged Supabase secret marker found in frontend files.'
            exit 1
          fi

<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Workshop TV · PMG PDC</title>
  <link rel="icon" href="favicon.svg">
  <style>
    /* r605 (F219): view-only workshop screen. Planner colours: blue running, red flashing over time,
       amber stoppage, green done, white planned. */
    :root { --bg: #f1f5f9; --card: #ffffff; --line: #e2e8f0; --ink: #0f172a; --muted: #64748b;
      --row-h: 34px; --name-w: clamp(150px, 15vw, 260px); --now-pct: -10%; color-scheme: light; }
    * { box-sizing: border-box; }
    /* r609 (F223): hidden must win over the gate's display:grid, or the sign-in box never goes away. */
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 14px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
    #tv-head { display: flex; align-items: center; gap: 18px; padding: 8px 16px; background: #0f172a; color: #fff; }
    #tv-head h1 { margin: 0; font-size: clamp(16px, 1.6vw, 26px); font-weight: 800; letter-spacing: .02em; }
    #tv-clock { font-size: clamp(16px, 1.6vw, 26px); font-variant-numeric: tabular-nums; font-weight: 700; }
    .tv-legend { display: flex; gap: 10px; margin-left: auto; font-size: clamp(11px, .9vw, 15px); flex-wrap: wrap; }
    .tv-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(255,255,255,.4); }
    #tv-status { font-size: 12px; color: #cbd5e1; min-width: 110px; text-align: right; }
    #tv-status.is-stale { color: #fca5a5; font-weight: 700; }
    #tv-full { border: 1px solid #475569; background: transparent; color: #e2e8f0; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
    #tv-full:hover, #tv-full:focus-visible { background: #1e293b; }
    #tv-board { padding: 8px 12px; display: grid; gap: 8px; align-content: start; height: calc(100% - 52px); overflow: hidden; }
    #tv-board.two-col { display: block; column-count: 2; column-gap: 12px; }
    #tv-board.two-col .tv-station { break-inside: avoid; margin-bottom: 8px; }
    .tv-station { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .tv-station header { display: grid; grid-template-columns: var(--name-w) 1fr 1fr; align-items: end; background: #f8fafc; border-bottom: 1px solid var(--line); min-height: calc(var(--row-h) * .9); position: relative; }
    .tv-station h2 { margin: 0; padding: 4px 10px; font-size: calc(var(--row-h) * .5); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .tv-over-count { display: inline-block; vertical-align: 2px; margin-left: 6px; background: #dc2626; color: #fff; font-weight: 800; font-size: calc(var(--row-h) * .36); padding: 1px 8px; border-radius: 999px; }
    .tv-hours { position: relative; height: calc(var(--row-h) * .9); border-left: 2px solid #cbd5e1; }
    .tv-hours em { position: absolute; left: 6px; top: 2px; font-style: normal; font-weight: 800; font-size: calc(var(--row-h) * .34); color: var(--ink); }
    .tv-hours span { position: absolute; bottom: 2px; transform: translateX(-50%); font-size: calc(var(--row-h) * .34); color: var(--muted); font-variant-numeric: tabular-nums; }
    .tv-bay { display: grid; grid-template-columns: var(--name-w) 1fr 1fr; height: var(--row-h); border-bottom: 1px solid #f1f5f9; }
    .tv-bay:last-child { border-bottom: 0; }
    .tv-bay-name { display: flex; flex-direction: column; justify-content: center; padding: 0 10px; min-width: 0; border-right: 1px solid var(--line); }
    .tv-bay-name strong { font-size: calc(var(--row-h) * .38); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tv-bay-name small { font-size: calc(var(--row-h) * .3); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tv-bay.has-over .tv-bay-name { background: #fef2f2; box-shadow: inset 4px 0 0 #dc2626; }
    .tv-track { position: relative; overflow: hidden;
      background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1px), #f1f5f9 calc(10% - 1px), #f1f5f9 10%); }
    .tv-track { border-left: 2px solid #cbd5e1; }
    .tv-track:not(.is-today)::after { display: none; }
    .tv-track::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--now-pct); width: 2px; background: #ef4444; z-index: 3; }
    .tv-after-hours .tv-track::after { display: none; }
    .tv-job { position: absolute; top: 3px; bottom: 3px; display: flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 5px;
      border: 1px solid #94a3b8; border-left-width: 4px; background: #fff; overflow: hidden; white-space: nowrap; font-size: calc(var(--row-h) * .36); font-weight: 600; }
    .tv-job span { overflow: hidden; text-overflow: ellipsis; }
    .tv-job b { font-size: .85em; letter-spacing: .04em; }
    .tv-job.is-plan { background: #ffffff; border-color: #94a3b8; }
    .tv-job.is-live { background: #dbeafe; border-color: #2563eb; border-left-color: #1d4ed8; animation: tv-live 1.25s ease-in-out infinite; }
    .tv-job.is-over { background: #dc2626; border-color: #7f1d1d; color: #fff; z-index: 2; animation: tv-over 1.1s ease-in-out infinite; }
    .tv-job.is-stop { background: #fde68a; border-color: #b45309; color: #78350f; }
    .tv-job.is-done { background: #dcfce7; border-color: #16a34a; color: #14532d; opacity: .8; }
    .tv-job.is-edge { padding: 0; }
    @keyframes tv-live { 0%, 100% { background: #dbeafe; } 50% { background: #93c5fd; } }
    @keyframes tv-over { 0%, 100% { background: #dc2626; } 50% { background: #7f1d1d; } }
    .tv-msg { margin: 40px auto; font-size: 22px; color: var(--muted); text-align: center; }
    #tv-gear { position: fixed; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 18px; opacity: .35; cursor: pointer; }
    #tv-gear:hover, #tv-gear:focus-visible { opacity: 1; }
    #tv-picker { position: fixed; right: 10px; bottom: 54px; width: 260px; max-height: 70vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(15,23,42,.2); padding: 12px; z-index: 10; }
    #tv-picker h3 { margin: 0 0 8px; font-size: 15px; }
    #tv-picker-list { display: grid; gap: 6px; margin-bottom: 10px; }
    #tv-picker-list label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    .tv-pick-station { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    .tv-pick-bay { padding-left: 22px; font-size: 13px !important; color: var(--muted); }
    #tv-picker button { border: 1px solid var(--line); background: #f8fafc; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    #tv-picker p.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    #tv-gate { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 20; }
    #tv-gate div { max-width: 520px; text-align: center; font-size: 20px; padding: 24px; }
    #tv-gate h2 { margin: 0 0 8px; font-size: 28px; }
    #tv-signin { display: grid; gap: 6px; text-align: left; margin: 12px auto 0; max-width: 340px; font-size: 16px; }
    #tv-signin input { font-size: 18px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    #tv-signin button { margin-top: 8px; font-size: 18px; padding: 10px; border: 0; border-radius: 6px; background: #0f172a; color: #fff; cursor: pointer; }
    #tv-signin button:disabled { opacity: .6; }
    #tv-signin-error { color: #b91c1c; font-size: 14px; min-height: 18px; margin: 4px 0 0; }
    .tv-gate-note { font-size: 13px; color: var(--muted); }
    /* r706 (F316): Tint and Tyres side by side at the bottom, full key and Start / Stop. */
    .tv-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } /* r710: four zones, one per bay */
    .tv-zone ul { list-style: none; margin: 0; padding: 4px 6px; display: grid; gap: 4px; }
    .tv-zone h2 small { font-size: .7em; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; }
    .tv-zone .tv-aj { grid-template-columns: auto 1fr auto; }
    .tv-znote { margin: 4px 6px 0; padding: 6px 8px; border-radius: 6px; font-weight: 800; font-size: clamp(13px, 1.05vw, 18px); line-height: 1.25; }
    .tv-znote.is-bad { background: #fee2e2; color: #991b1b; border: 2px solid #dc2626; }
    .tv-znote.is-ok { background: #dcfce7; color: #14532d; border: 2px solid #16a34a; }
    .tv-astation { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .tv-astation h2 { margin: 0; padding: 4px 10px; font-size: clamp(14px, 1.2vw, 20px); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; background: #f8fafc; border-bottom: 1px solid var(--line); }
    .tv-abay { display: grid; grid-template-columns: clamp(110px, 10vw, 180px) 1fr; border-bottom: 1px solid #f1f5f9; }
    .tv-abay:last-child { border-bottom: 0; }
    .tv-abay-name { display: flex; flex-direction: column; justify-content: center; padding: 4px 10px; border-right: 1px solid var(--line); }
    .tv-abay-name strong { font-size: clamp(13px, 1vw, 17px); }
    .tv-abay-name small { font-size: clamp(11px, .8vw, 14px); color: var(--muted); }
    .tv-abay ul { list-style: none; margin: 0; padding: 3px 6px; display: grid; gap: 3px; }
    .tv-aj { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 5px; border: 1px solid #94a3b8; border-left-width: 4px; background: #fff; font-size: clamp(12px, .95vw, 16px); }
    .tv-aj-key { font-size: clamp(15px, 1.25vw, 22px); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tv-aj-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .tv-aj-when { font-weight: 700; color: var(--muted); white-space: nowrap; }
    .tv-aj.is-live { background: #dbeafe; border-color: #2563eb; }
    .tv-aj.is-over { background: #fee2e2; border-color: #dc2626; }
    .tv-aj.is-over .tv-aj-when { color: #b91c1c; }
    .tv-aj.is-stop { background: #fef3c7; border-color: #b45309; }
    .tv-aj.is-done { background: #dcfce7; border-color: #16a34a; opacity: .75; }
    .tv-aj.is-empty { grid-template-columns: 1fr; color: var(--muted); border-style: dashed; }
    .tv-act { border: 0; border-radius: 6px; padding: 6px 16px; font: inherit; font-weight: 800; color: #fff; cursor: pointer; min-width: 78px; }
    .tv-act-start { background: #15803d; }
    .tv-act-stop { background: #b91c1c; }
    .tv-act:disabled { opacity: .55; cursor: wait; }
    @media (prefers-reduced-motion: reduce) { .tv-job.is-live, .tv-job.is-over { animation: none; } }
  </style>
</head>
<body>
  <div id="tv-head">
    <h1>WORKSHOP</h1>
    <div id="tv-clock"></div>
    <div class="tv-legend" aria-label="Colour key">
      <span><i style="background:#fff"></i>Planned</span>
      <span><i style="background:#93c5fd"></i>Running</span>
      <span><i style="background:#dc2626"></i>Over time</span>
      <span><i style="background:#fde68a"></i>Stoppage</span>
      <span><i style="background:#dcfce7"></i>Done</span>
    </div>
    <div id="tv-status" role="status"></div>
    <button type="button" id="tv-full">Full screen</button>
  </div>
  <main id="tv-board" aria-live="off"><p class="tv-msg">Loading the workshop…</p></main>
  <button type="button" id="tv-gear" title="Choose stations for this screen" aria-label="Choose stations for this screen">⚙</button>
  <div id="tv-picker" hidden>
    <h3>Stations and bays on this screen</h3>
    <div id="tv-picker-list"></div>
    <button type="button" id="tv-picker-all">Show all</button>
    <button type="button" id="tv-picker-close">Close</button>
    <p class="note">Saved on this screen only.</p>
  </div>
  <div id="tv-gate" hidden><div>
    <h2>Workshop TV</h2>
    <p id="tv-gate-msg"></p>
    <form id="tv-signin" autocomplete="on">
      <label for="tv-email">Email</label><input id="tv-email" type="email" autocomplete="username" required>
      <label for="tv-password">Password</label><input id="tv-password" type="password" autocomplete="current-password" required>
      <button type="submit" id="tv-signin-go">Sign in</button>
      <p id="tv-signin-error" role="alert"></p>
    </form>
    <p class="tv-gate-note">Use a board login. This screen stays signed in.</p>
  </div></div>
  <script src="vendor/supabase/supabase-2.110.5.js"></script>
  <script src="pdc-supabase-config.staging.js?v=2026.09.04.0110-pdc14-location-replay"></script>
  <script src="workshop-tv.js?r605=2026.10.28.r605&amp;r608=2026.10.28.r608&amp;r609=2026.10.28.r609&amp;r686=2026.10.29.r686&amp;r706=2026.10.29.r706&amp;r710=2026.10.29.r710&amp;r711=2026.10.29.r711&amp;r741=2026.10.30.r741"></script>
</body>
</html>
